<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 254.62 189.12" role="img" aria-labelledby="spider-title spider-desc">
  <title id="spider-title">Capability spider plot</title>
